# Environment for the WP1 LITERAL reproduction track (venv_microfrb on popos).
# Python 3.10.12. Reconstructed by hand — the MICRO-FRB repo ships no
# requirements.txt / pinned versions (a reproducibility hazard, logged in
# docs/WP1_gate_memo.md).
#
# reproduction core  — required to RUN the authors' pipeline (SearchLensedFRB.py
#   + modules). numpy/scipy/matplotlib/h5py drive the analysis; colossus +
#   statsmodels are UNDECLARED deps their modules/__init__ imports eagerly.
#   These pins reproduce the committed G_3/SG_20/SG_100 results exactly.
# analysis harness   — pyarrow + pyyaml: NOT needed by the authors' code; used by
#   our W1.4/W1.5 sweep/aggregate harness (parquet + yaml). Additive only.
#
# Clean-room + selection + matrix tracks run in the project .venv
# (env/requirements.lock). See env/README.md.

